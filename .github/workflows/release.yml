name: release
# Push a tag like v0.1.3 (see "Releasing" in the README): tests, stages the release on npm,
# creates the GitHub release. The npm version goes live only when the maintainer approves it (2FA).
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing (no token stored) + provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # `npm stage` needs npm 11.15+
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm stage publish --provenance --access public
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Next step
        run: echo "Staged $GITHUB_REF_NAME. Approve it at npmjs.com > ats-jobs > Staged Packages, or run 'npm stage list ats-jobs' then 'npm stage approve <id>'." >> "$GITHUB_STEP_SUMMARY"
