name: release
# Push a tag like v0.1.3 (see "Releasing" in the README): tests, publishes to npm, creates the GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing (no token stored) + provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
